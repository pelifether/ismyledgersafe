<style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
*{box-sizing:border-box}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.page{width:min(680px,100% - 32px);margin:40px auto 72px}
.top h1{margin:0;color:var(--anatomy-strong);font-size:22px;font-weight:600;letter-spacing:-.01em}
.ic{width:20px;height:20px;flex:none}
button,select,input{font:inherit;color:inherit}

/* Figure: parts of the spyware build, in red, and their states. */
.iso-figure{margin:20px 0 24px}
.iso-stage{cursor:pointer;outline:none;border-radius:2px}
.iso-stage:focus-visible{box-shadow:0 0 0 2px var(--anatomy-mid)}
.iso-plate-corner[data-corner="readout"]{text-transform:uppercase;letter-spacing:.1em}
.lg-wall{fill:var(--anatomy-shade-1);stroke:none}
.lg-floor>.iso-fill{fill:var(--anatomy-shade-0)}
.lg-glass>.iso-fill{fill:var(--anatomy-shade-0)}
.lg-bad{transition:opacity .5s var(--anatomy-ease)}
.lg-bad .iso-edge,.lg-bad .iso-crease,.lg-bad .iso-bevel,.lg-bad .iso-line{stroke:var(--anatomy-red)}
.lg-bad .iso-top{fill:color-mix(in srgb,var(--anatomy-red) 16%,var(--anatomy-top))}
.lg-bad .iso-shade{fill:color-mix(in srgb,var(--anatomy-red) 10%,var(--anatomy-shade-1))}
.lg-bad .iso-face-text{fill:var(--anatomy-red)}
.lg-bad .iso-wire-end{stroke:var(--anatomy-red)}
.lg-bad .iso-dots circle{fill:var(--anatomy-red)}
.lg-lead path{stroke-width:1.1px}
.lg-good .iso-edge{transition:stroke .5s var(--anatomy-ease)}
[data-mode="scan"] .lg-bad{opacity:.18}
[data-mode="unclear"] .lg-bad{opacity:.3}
[data-mode="clean"] .lg-bad{opacity:0}
[data-mode="clean"] .lg-good .iso-edge{stroke:var(--anatomy-green)}
[data-mode="tampered"] [data-find]:not([data-hit]){opacity:.28}
[data-mode="tampered"] [data-find][data-focus]{animation:lg-pulse 1.1s ease-in-out infinite}
[data-mode="scan"] .iso-svg{animation:lg-scan 1.4s ease-in-out infinite}
@keyframes lg-pulse{50%{opacity:.35}}
@keyframes lg-scan{50%{opacity:.82}}
@media (prefers-reduced-motion:reduce){[data-mode] .iso-svg,[data-mode] [data-find]{animation:none!important}}

/* Intake */
.intake{display:grid;gap:12px}
.drop{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:112px;padding:20px;border:1px dashed var(--anatomy-mid);background:var(--anatomy-card);color:var(--anatomy-strong);cursor:pointer;text-align:center;transition:border-color .2s,background .2s}
.drop .ic{width:34px;height:34px}
.drop:hover,.drop[data-over]{border-color:var(--anatomy-hi)}
.drop-shots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.drop-shots span{padding:2px 8px;border:1px solid var(--anatomy-lo);color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.thumbs:empty{display:none}
.thumbs li{position:relative;width:76px;height:76px;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-lo)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:2px;right:2px;display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;background:#000000b0;color:#fff;cursor:pointer}
.thumbs button .ic{width:14px;height:14px}
.go{justify-self:start;min-width:140px;padding:11px 22px;border:0;background:var(--anatomy-strong);color:var(--anatomy-page);font-weight:600;cursor:pointer}
.go:disabled{opacity:.35;cursor:default}
.go[data-busy]{opacity:.6;cursor:progress}

/* Result */
.result{display:grid;gap:16px;margin-top:28px;padding-top:24px;border-top:1px solid var(--anatomy-lo)}
.verdict{display:flex;align-items:center;gap:12px}
.verdict-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--anatomy-card);box-shadow:0 0 0 1px currentColor}
.verdict-mark .ic{width:24px;height:24px}
.verdict h2{margin:0;font-size:26px;line-height:1.1;font-weight:650;letter-spacing:-.01em}
.confidence{margin-left:auto;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.verdict[data-v="tampered"]{color:var(--anatomy-red)}
.verdict[data-v="suspicious"]{color:#f5a524}
.verdict[data-v="no_implant_seen"]{color:var(--anatomy-green)}
.verdict[data-v="cannot_tell"]{color:var(--anatomy-muted)}
.finds{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.finds:empty{display:none}
.finds button{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--anatomy-red);background:transparent;color:var(--anatomy-strong);font-size:13px;cursor:pointer}
.finds button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--anatomy-red)}
.finds button[aria-pressed="true"]{background:color-mix(in srgb,var(--anatomy-red) 18%,transparent)}
.advice{display:grid;gap:6px;margin:0;color:var(--anatomy-text)}
.advice b{color:var(--anatomy-strong);font-weight:600}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.shot{position:relative;margin:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-lo);line-height:0}
.shot img{width:100%;height:auto;display:block}
.box{position:absolute;border:2px solid var(--anatomy-red);border-radius:3px;box-shadow:0 0 0 1px #0008;pointer-events:none;transition:box-shadow .2s}
.box[data-focus]{box-shadow:0 0 0 1px #0008,0 0 0 4px color-mix(in srgb,var(--anatomy-red) 45%,transparent)}
.box span{position:absolute;left:-2px;bottom:100%;padding:1px 5px;background:var(--anatomy-red);color:#fff;font:600 10px/1.5 var(--anatomy-mono);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.need{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0;color:var(--anatomy-muted)}
.need b{color:var(--anatomy-strong);font-weight:500}
.share{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-lo)}
.share select,.share input{min-width:0;flex:1 1 140px;padding:8px 10px;border:1px solid var(--anatomy-lo);background:var(--anatomy-page)}
.share-go{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--anatomy-hi);background:transparent;cursor:pointer;font-weight:600;color:var(--anatomy-strong)}
.share small{flex-basis:100%;color:var(--anatomy-muted);font-size:12px}
.share[data-done] select,.share[data-done] input,.share[data-done] small{display:none}
.share[data-done] .share-go{border-color:var(--anatomy-green);color:var(--anatomy-green);cursor:default}
.foot{margin-top:40px;color:var(--anatomy-muted);font-size:12px}
.error{color:var(--anatomy-red)}
@media (max-width:560px){.page{margin-top:24px}.verdict h2{font-size:22px}}
</style>
</head>

<script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];

const P = {"origin":[323.48258030693466,336.68912601142586],"scale":0.977418617843641,"azimuth":62,"elevation":32};
const LIFT = {"cover":196,"oled":138,"implant":92,"pcb":48};
const STAGGER = ["cover","oled","implant","pcb"];

  const [px, py] = TAP_PAD;

const stage = document.querySelector(".iso-stage");

  pending = pending.filter((item) => { if (clock >= item.at) { parts[item.name].target = item.value; return false; } return true; });
  let moving = pending.length > 0;
  for (const name of STAGGER) {
    const part = parts[name];

    const h = dt / SPRING.substeps;
    for (let i = 0; i < SPRING.substeps; i++) { part.v += ((part.target - part.x) * SPRING.stiffness - part.v * SPRING.damping) * h; part.x += part.v * h; }

// The page drives the figure through this: idle (shows the spyware build),
// scan (opens and holds), clean, tampered (lights the parts that were found),
// unclear.
window.ledgerFigure = {
  setMode(mode, { finds = [], label = "" } = {}) {
    stage.dataset.mode = mode;
    for (const node of svg.querySelectorAll("[data-find]")) {
      if (finds.includes(node.dataset.find)) node.setAttribute("data-hit", "");
      else node.removeAttribute("data-hit");
    }
    say(label);
    if (mode === "idle") { touring = !still.matches; tourAt = clock + 1; run(); return; }
    touring = false;
    clearTimeout(idleTimer);
    schedule(true);
  },
  focus(find) {
    for (const node of svg.querySelectorAll("[data-find]")) node.toggleAttribute("data-focus", node.dataset.find === find);
  },
